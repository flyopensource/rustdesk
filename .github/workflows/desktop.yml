name: Desktop Build (Windows + Linux + macOS)

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag used to publish the build outputs
        required: true
        default: desktop
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.release-tag }}
      desktop-only: true
